allowBuilds:
  esbuild: true
# 🛡️ pnpm 11 minimumReleaseAge (1 day) stays ON. Strict mode: pnpm fails instead of quietly adding
#    exclude entries by itself, so every exemption is a reviewed, test-guarded line.
minimumReleaseAgeStrict: true
# ⏳ D33 (scoped, expiring exemptions): our own brand-new releases, one exact version each.
#    Expiries live in __tests__/release-age.test.ts ALLOWED_EXCLUDES (publish time + 24h, UTC);
#    the suite fails after them.
minimumReleaseAgeExclude:
